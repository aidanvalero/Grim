# Everything a rig job needs before run.sh: the rig's exact Paper build (hash-checked) with what it downloads on first
# boot, the cached 26.3 client, and the rig image (Ubuntu 24.04, Temurin 25.0.4.1+1, portablemc 5.0.6, Xvfb + Mesa)
name: rig-setup
description: Paper 26.3-205, the 26.3 client cache and the rig container image
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with: {distribution: temurin, java-version: '25'}
    - uses: actions/cache@v4
      with: {path: mc-cache, key: mc-26.3-portablemc-5.0.6-v1}
    - uses: actions/cache@v4
      with:
        path: |
          rig/stage/repro263/cache
          rig/stage/repro263/libraries
          rig/stage/repro263/versions
        key: paper-26.3-205-v1
    - name: Paper 26.3-205, the rig's exact jar
      shell: bash
      run: |
        cd rig/stage/repro263
        curl -fsSL -o paper.jar "https://fill-data.papermc.io/v1/objects/$PAPER_SHA256/paper-26.3-205.jar"
        echo "$PAPER_SHA256  paper.jar" | sha256sum -c
        [ -d versions ] || java -Dpaperclip.patchonly=true -jar paper.jar
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with: {context: rig, tags: grim-ci, load: true, cache-from: type=gha, cache-to: 'type=gha,mode=max,ignore-error=true'}
    - shell: bash
      run: mkdir -p out mc-cache
